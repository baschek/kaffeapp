<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211710" />
    <meta name="description" content="Privater Kaffee- und Tiefkühlglas-Bestand mit vollständiger Chargenhistorie." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Kaffee-Bestand</title>
    <script>
      // Gespeicherte Farbwelt und Modus vor dem ersten Zeichnen setzen (kein Aufblitzen). Gleiche Logik wie src/ui/theme.ts.
      try {
        var l = JSON.parse(localStorage.getItem('kaffee-bestand.look.v1') || 'null') || {}, d = document.documentElement
        d.classList.add('pal-' + (['sand', 'frost', 'schiefer', 'mono'].indexOf(l.palette) >= 0 ? l.palette : 'sand'),
          l.mode === 'dark' ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
